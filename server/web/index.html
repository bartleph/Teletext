<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Teletext</title>
<style>
  html, body { margin: 0; background: #000; color: #bbb; height: 100%;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); box-sizing: border-box; }
  /* portrait (phones): picture on top, as wide as fits while leaving room for the buttons */
  #tv { width: min(100vw, calc((100vh - 400px) * 4 / 3)); width: min(100vw, calc((100dvh - 400px) * 4 / 3));
        min-width: 240px; aspect-ratio: 4 / 3; background: #000; touch-action: pan-y; flex: none; }
  #tv { position: relative; overflow: hidden; }
  #tv canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #tv.sharp canvas { image-rendering: pixelated; }
  /* optional CRT look: scanlines, glow, dark corners and a slightly rounded tube */
  #crt { display: none; position: absolute; inset: 0; pointer-events: none;
         background:
           radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
           linear-gradient(rgba(0,0,0,.32) 50%, transparent 50%) 0 0 / 100% 0.8%,
           linear-gradient(90deg, rgba(255,0,0,.05), rgba(0,255,0,.04), rgba(0,0,255,.05)) 0 0 / 3px 100%; }
  #tv.crt { border-radius: 1% / 1.3%; box-shadow: 0 0 40px rgba(120,160,255,.12); }
  #tv.crt #crt { display: block; }
  #tv.crt canvas { filter: blur(.5px) contrast(1.12) brightness(1.12) saturate(1.2); image-rendering: auto; }
  .pad { width: 100%; max-width: 520px; padding: 6px 10px; box-sizing: border-box; display: grid; gap: 8px; }
  .fast { grid-template-columns: repeat(4, 1fr); }
  .keys { grid-template-columns: repeat(5, 1fr); }
  button { font: inherit; font-size: 20px; color: #fff; background: #1c1c1c; border: 1px solid #3a3a3a;
           border-radius: 8px; height: 50px; padding: 0; -webkit-tap-highlight-color: transparent;
           touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button:active { background: #444; }
  button.small { font-size: 15px; }
  button.on { background: #0a3d7a; border-color: #2d6fc0; }
  .fast button { height: 40px; border: 0; }
  #b0 { background: #e00000; } #b1 { background: #00c000; }
  #b2 { background: #e8e800; } #b3 { background: #00d8d8; }
  #flashbar { display: none; width: 100%; max-width: 520px; padding: 0 10px; box-sizing: border-box; }
  #flashbar button { width: 100%; height: 40px; font-size: 15px; background: #600; border-color: #a00; }
  #status { font-size: 13px; color: #777; text-align: center; padding: 4px 10px 10px; min-height: 18px; }
  /* wide screens (PCs, tablets and phones on their side): buttons beside the picture */
  @media (min-aspect-ratio: 1/1) {
    body { flex-direction: row; justify-content: center; align-items: center; height: 100vh; height: 100dvh; }
    #tv { width: min(calc(100vw - 360px), calc(100vh * 4 / 3)); width: min(calc(100vw - 360px), calc(100dvh * 4 / 3)); }
    #side { display: flex; flex-direction: column; justify-content: center; width: 340px; flex: none; }
  }
  /* keyboard mode: no keypad, the picture fills the window (toggle with K, or ?pad=0 / ?pad=1) */
  body.nopad #side { display: none; }
  body.nopad #tv { width: min(100vw, calc(100vh * 4 / 3)); width: min(100vw, calc(100dvh * 4 / 3)); }
  body.nopad { justify-content: center; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<div id="tv"><canvas id="screen" width="480" height="500"></canvas><div id="crt"></div></div>
<div id="side">
  <div class="pad fast">
    <button id="b0" aria-label="Red"></button>
    <button id="b1" aria-label="Green"></button>
    <button id="b2" aria-label="Yellow"></button>
    <button id="b3" aria-label="Cyan"></button>
  </div>
  <div id="flashbar"><button id="dismiss">Dismiss newsflash</button></div>
  <div class="pad keys">
    <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
    <button data-d="4">4</button><button data-d="5">5</button>
    <button data-d="6">6</button><button data-d="7">7</button><button data-d="8">8</button>
    <button data-d="9">9</button><button data-d="0">0</button>
    <button id="prev" aria-label="Previous page">&#9664;</button>
    <button id="next" aria-label="Next page">&#9654;</button>
    <button id="index" class="small">Index</button>
    <button id="reveal" class="small">Reveal</button>
    <button id="hold" class="small">Hold</button>
    <button id="subprev" class="small">&#9664; Sub</button>
    <button id="subnext" class="small">Sub &#9654;</button>
    <button id="smooth" class="small on">Smooth</button>
    <button id="crtbtn" class="small">CRT</button>
    <button id="install" class="small" style="display:none">Install</button>
  </div>
  <div id="status"></div>
</div>

 * and asks the server for the current page once a second.

const COLS = 40, ROWS = 25, CW = 12, CH = 20, W = COLS * CW, H = ROWS * CH;
const RGB = [[0,0,0],[255,0,0],[0,255,0],[255,255,0],[0,0,255],[255,0,255],[0,255,255],[255,255,255]];
const PAL = RGB.map(([r, g, b]) => (0xFF000000 | (b << 16) | (g << 8) | r) >>> 0);

// 12x20 glyphs with "character rounding", as the SAA5050 does
const GLYPH = ROM.map(rom => {
  const g = new Array(20).fill(0);
  for (let r = 0; r < 10; r++)
    for (let x = 0; x < 6; x++)
      if (rom[r] & (0x20 >> x)) { const two = 0xC00 >> (2 * x); g[2*r] |= two; g[2*r+1] |= two; }
  for (let r = 0; r < 9; r++)
    for (let x = 0; x < 5; x++) {
      const a0 = rom[r] & (0x20 >> x), a1 = rom[r] & (0x20 >> (x + 1));
      const b0 = rom[r+1] & (0x20 >> x), b1 = rom[r+1] & (0x20 >> (x + 1));
      const pL = 0x800 >> (2*x + 1), pR = 0x800 >> (2*x + 2);
      if (a0 && b1 && !a1 && !b0) { g[2*r+1] |= pR; g[2*r+2] |= pL; }
      if (a1 && b0 && !a0 && !b1) { g[2*r+1] |= pL; g[2*r+2] |= pR; }
    }
  return g;
});

// keypad on/off: ?pad=0 or ?pad=1 in the address wins, otherwise the last choice is remembered
function setPad(on, save) {
  document.body.classList.toggle("nopad", !on);
  if (save) try { localStorage.setItem("ttxPad", on ? "1" : "0"); } catch (e) {}
}
(function () {
  let v = new URLSearchParams(location.search).get("pad");
  if (v === null) try { v = localStorage.getItem("ttxPad"); } catch (e) {}
  if (v === "0") setPad(false, false);
  if (v === "0" || v === "1") try { localStorage.setItem("ttxPad", v); } catch (e) {}
})();

// CRT filter: ?crt=1 / ?crt=0 in the address wins, otherwise the last choice is remembered
function setCrt(on, save) {
  document.getElementById("tv").classList.toggle("crt", on);
  document.getElementById("crtbtn").classList.toggle("on", on);
  if (save) try { localStorage.setItem("ttxCrt", on ? "1" : "0"); } catch (e) {}
}
function toggleCrt() { setCrt(!document.getElementById("tv").classList.contains("crt"), true); }
(function () {
  let v = new URLSearchParams(location.search).get("crt");
  if (v === null) try { v = localStorage.getItem("ttxCrt"); } catch (e) {}
  if (v === "1") setCrt(true, false);
  if (v === "0" || v === "1") try { localStorage.setItem("ttxCrt", v); } catch (e) {}
})();

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const img = ctx.createImageData(W, H);
const pix = new Uint32Array(img.data.buffer);

// ---- state ----
let screen = new Uint8Array(COLS * ROWS).fill(32);
let pageNum = parseInt(localStorage.getItem("ttxPage") || "100", 16) || 0x100;
let fixedSub = 0, sub = 0, subCount = 0;
let links = [0, 0, 0, 0, 0x100];
let entry = "";
let reveal = false, hold = false, flashOn = true;
let waiting = true;                      // we asked for a page and haven't got it yet
let flash = null, dismissed = "", tick = 0;
let reqSeq = 0, online = false;

try { pageNum = parseInt(localStorage.getItem("ttxPage") || "100", 16) || 0x100; } catch (e) {}

function hex3(n) { return n.toString(16).toUpperCase().padStart(3, "0"); }
function flashShowing() { return flash && flash.text !== dismissed; }

// ---- drawing ----
function fill(x, y, w, h, c) {
  for (let yy = y; yy < y + h && yy < H; yy++) {
    const o = yy * W;
    for (let xx = x; xx < x + w; xx++) pix[o + xx] = c;
  }
}

function mosaic(x, y, h, ch, fg, sep) {
  const bit = [[1, 2], [4, 8], [16, 64]];
  const rh = [Math.floor(h * 3 / 10), Math.floor(h * 4 / 10)];
  rh.push(h - rh[0] - rh[1]);
  const gx = 2, gy = Math.floor(h / 10);
  let yy = y;
  for (let r = 0; r < 3; r++) {
    for (let k = 0; k < 2; k++)
      if (ch & bit[r][k]) {
        const xx = x + k * 6;
        if (sep) fill(xx + gx, yy, 6 - gx, rh[r] - gy, PAL[fg]);
        else     fill(xx, yy, 6, rh[r], PAL[fg]);
      }
    yy += rh[r];
  }
}

function glyph(x, y, h, ch, fg, dbl) {
  if (ch < 0x20 || ch > 0x7F) return;
  const g = GLYPH[ch - 0x20], c = PAL[fg];
  for (let line = 0; line < h && y + line < H; line++) {
    const bits = g[dbl ? line >> 1 : line];
    if (!bits) continue;
    const o = (y + line) * W + x;
    for (let px = 0; px < CW; px++) if (bits & (0x800 >> px)) pix[o + px] = c;
  }
}

function headerOverlay(rb) {
  let t;
  if (entry.length) t = " " + (entry + "--").slice(0, 3);
  else if (hold) t = " HOLD";
  else t = " " + hex3(pageNum);
  t = (t + "        ").slice(0, 8);
  for (let i = 0; i < 8; i++) rb[i] = t.charCodeAt(i);
}

function flashOverlay(rb) {
  const head = [0x01, 0x1D, 0x07, 0x08, ..."NEWSFLASH".split("").map(c => c.charCodeAt(0)),
                0x09, 0x04, 0x1D, 0x03];
  head.forEach((v, i) => rb[i] = v);
  const loop = flash.text + "   +++   ";
  for (let i = head.length; i < COLS; i++)
    rb[i] = loop.charCodeAt((tick + i - head.length) % loop.length) & 0x7F;
}

function render() {
  pix.fill(PAL[0]);
  let skip = false;
  for (let row = 0; row < ROWS; row++) {
    if (skip) { skip = false; continue; }
    const rb = screen.slice(row * COLS, row * COLS + COLS);
    if (row === 0) headerOverlay(rb);
    if (row === ROWS - 1 && flashShowing()) flashOverlay(rb);

    let rowDbl = false;
    if (row > 0 && row < ROWS - 1) for (let c = 0; c < COLS; c++) if ((rb[c] & 0x7F) === 0x0D) rowDbl = true;

    let fg = 7, bg = 0, gfx = false, sep = false, holdG = false, fl = false, conceal = false, dbl = false;
    let held = 0x20, heldSep = false;
    const y = row * CH;
    for (let col = 0; col < COLS; col++) {
      const c = rb[col] & 0x7F, x = col * CW;
      switch (c) {                                    // set-at
        case 0x09: fl = false; break;
        case 0x0C: if (dbl) held = 0x20; dbl = false; break;
        case 0x18: conceal = true; break;
        case 0x19: sep = false; break;
        case 0x1A: sep = true; break;
        case 0x1C: bg = 0; break;
        case 0x1D: bg = fg; break;
        case 0x1E: holdG = true; break;
      }
      let show = 0x20, showSep = sep, mos = false;
      if (c < 0x20) { if (holdG && gfx) { show = held; showSep = heldSep; mos = true; } }
      else { show = c; if (gfx && (c & 0x20)) { mos = true; held = c; heldSep = sep; } }

      fill(x, y, CW, rowDbl ? 2 * CH : CH, PAL[bg]);
      const visible = !(fl && !flashOn) && !(conceal && !reveal);
      if (visible && show !== 0x20) {
        const h = dbl ? 2 * CH : CH;
        if (mos) mosaic(x, y, h, show, fg, showSep); else glyph(x, y, h, show, fg, dbl);
      }
      if (c <= 0x07) { fg = c; gfx = false; conceal = false; held = 0x20; }   // set-after
      else if (c >= 0x10 && c <= 0x17) { fg = c - 0x10; gfx = true; conceal = false; }
      else if (c === 0x08) fl = true;
      else if (c === 0x0D && rowDbl) { dbl = true; held = 0x20; }
      else if (c === 0x1F) holdG = false;
    }
    if (rowDbl) skip = true;
  }
  ctx.putImageData(img, 0, 0);
}

function putText(row, col, s) {
  for (let i = 0; i < s.length && col < COLS; i++) screen[row * COLS + col++] = s.charCodeAt(i) & 0x7F;
}

// ---- talking to the server ----
function fromHex(h, into, offset) {
  for (let i = 0; i * 2 < h.length; i++) into[offset + i] = parseInt(h.substr(i * 2, 2), 16);
}

function setStatus() {
  const st = document.getElementById("status");
  if (!online) { st.textContent = "Cannot reach the teletext server - retrying..."; return; }
  let t = "Page " + hex3(pageNum);
  if (subCount > 1) t += "  " + sub + "/" + subCount;
  if (hold) t += "  HOLD";
  st.textContent = t + "   •  swipe the screen to change page";
}

async function poll() {
  const seq = ++reqSeq, asked = pageNum;
  try {
    const r = await fetch("api/page?p=" + hex3(asked) + "&s=" + fixedSub, { cache: "no-store" });
    const j = await r.json();
    if (seq !== reqSeq || asked !== pageNum) return;         // a newer request is on its way
    online = true;
    if (j.found) {
      const fresh = new Uint8Array(COLS * ROWS);
      fromHex(j.rows, fresh, 0);
      if (hold && !waiting) screen.set(fresh.subarray(8, COLS), 8);   // just the clock
      else { screen = fresh; sub = j.sub; subCount = j.count; links = j.links.map(v => parseInt(v, 16)); }
    } else {
      fromHex(j.header, screen, 0);
      if (waiting) {
        screen.fill(32, COLS);
        putText(10, 0, "\x01Page " + j.page + " is not available");
        putText(12, 0, "\x07Press Index for the index");
        subCount = 0;
      }
    }
    waiting = false;
    const f = j.flash || null;
    if (f && (!flash || f.text !== flash.text)) {
      tick = 0;
      const touched = navigator.userActivation ? navigator.userActivation.hasBeenActive : true;
      if (f.text !== dismissed && navigator.vibrate && touched) navigator.vibrate([150, 80, 150]);
    }
    flash = f;
    document.getElementById("flashbar").style.display = flashShowing() ? "block" : "none";
  } catch (e) {
    if (seq === reqSeq) online = false;
  }
  setStatus();
  render();
}

function go(page, s) {
  if (page < 0x100 || page > 0x8FF) return;
  if (page !== pageNum) reveal = false;
  pageNum = page;
  fixedSub = s || 0;
  waiting = true;
  try { localStorage.setItem("ttxPage", hex3(page)); } catch (e) {}
  updateButtons();
  setStatus();
  render();
  poll();
}

// ---- controls ----
function digit(d) {
  if (!entry.length && (d < "1" || d > "8")) return;
  entry += d;
  if (entry.length === 3) { const p = parseInt(entry, 16); entry = ""; hold = false; go(p); }
  render();
}

function stepPage(delta) {
  let m = (pageNum >> 8) & 15, t = Math.min((pageNum >> 4) & 15, 9), u = Math.min(pageNum & 15, 9);
  let d = m * 100 + t * 10 + u + delta;
  if (d > 899) d = 100;
  if (d < 100) d = 899;
  hold = false;
  go(parseInt(String(d), 16));
}

function stepSub(delta) {
  if (subCount < 2) return;
  let s = sub + delta;
  if (s > subCount) s = 1;
  if (s < 1) s = subCount;
  go(pageNum, s);
}

function link(i) {
  const p = links[i] || (i === 4 ? 0x100 : 0);
  if (p) { hold = false; go(p); }
}

function updateButtons() {
  document.getElementById("reveal").classList.toggle("on", reveal);
  document.getElementById("hold").classList.toggle("on", hold);
}

document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => digit(b.dataset.d));
for (let i = 0; i < 4; i++) document.getElementById("b" + i).onclick = () => link(i);
document.getElementById("prev").onclick = () => stepPage(-1);
document.getElementById("next").onclick = () => stepPage(+1);
document.getElementById("subprev").onclick = () => stepSub(-1);
document.getElementById("subnext").onclick = () => stepSub(+1);
document.getElementById("index").onclick = () => link(4);
document.getElementById("reveal").onclick = () => { reveal = !reveal; updateButtons(); render(); };
document.getElementById("hold").onclick = () => {
  hold = !hold;
  if (!hold) waiting = true;
  updateButtons(); setStatus(); render(); if (!hold) poll();
};
document.getElementById("smooth").onclick = (e) => {
  const tv = document.getElementById("tv");
  tv.classList.toggle("sharp");
  e.target.classList.toggle("on", !tv.classList.contains("sharp"));
};
document.getElementById("crtbtn").onclick = toggleCrt;
document.getElementById("dismiss").onclick = () => {
  if (flash) dismissed = flash.text;
  document.getElementById("flashbar").style.display = "none";
  render();
};

// tap a page number, a coloured link or the newsflash strip; swipe to change page
let touchX = 0, touchY = 0, touchT = 0;
canvas.addEventListener("touchstart", e => {
  const t = e.changedTouches[0]; touchX = t.clientX; touchY = t.clientY; touchT = Date.now();
}, { passive: true });
canvas.addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50 && Date.now() - touchT < 800) {
    e.preventDefault();
    stepPage(dx < 0 ? +1 : -1);
  }
});
canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX - r.left) / r.width * COLS);
  const row = Math.floor((e.clientY - r.top) / r.height * ROWS);
  if (row < 1 || row >= ROWS || col < 0 || col >= COLS) return;
  if (row === ROWS - 1 && flashShowing()) { hold = false; go(parseInt(flash.page, 16)); return; }
  const at = c => screen[row * COLS + c] & 0x7F;
  const isD = c => at(c) >= 0x30 && at(c) <= 0x39;
  if (isD(col)) {
    let a = col, b = col;
    while (a > 0 && isD(a - 1)) a--;
    while (b < COLS - 1 && isD(b + 1)) b++;
    if (b - a === 2 && at(a) >= 0x31 && at(a) <= 0x38) {
      hold = false;
      go(parseInt(String.fromCharCode(at(a), at(a + 1), at(a + 2)), 16));
      return;
    }
  }
  if (row === ROWS - 1) {                          // which colour was tapped?
    let fg = 7;
    for (let c = 0; c <= col; c++) if (at(c) <= 7) fg = at(c);
    const i = { 1: 0, 2: 1, 3: 2, 6: 3 }[fg];
    if (i !== undefined) link(i);
  }
});

// a keyboard works too (desktop browsers)
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;       // leave browser shortcuts alone
  if (e.key >= "0" && e.key <= "9") digit(e.key);
  else if (e.key === "ArrowUp" || e.key === "PageUp") stepPage(+1);
  else if (e.key === "ArrowDown" || e.key === "PageDown") stepPage(-1);
  else if (e.key === "ArrowRight") stepSub(+1);
  else if (e.key === "ArrowLeft") stepSub(-1);
  else if (e.key === "F1" || e.key === "F2" || e.key === "F3" || e.key === "F4") link(+e.key[1] - 1);
  else if (e.key === "F5" || e.key === "i") link(4);
  else if (e.key === "c") toggleCrt();
  else if (e.key === "k") setPad(document.body.classList.contains("nopad"), true);
  else if (e.key === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  else if (e.key === "r") document.getElementById("reveal").click();
  else if (e.key === "h") document.getElementById("hold").click();
  else if (e.key === "F6" && flash) go(parseInt(flash.page, 16));
  else if (e.key === "Escape") { if (entry) entry = ""; else document.getElementById("dismiss").click(); render(); }
  else return;
  e.preventDefault();
});

setInterval(() => { flashOn = !flashOn; render(); }, 500);
setInterval(() => { if (flashShowing()) { tick++; render(); } }, 250);
setInterval(poll, 1000);
updateButtons();
render();
poll();

// ---- install as an app (PWA) ----
if ("serviceWorker" in navigator && window.isSecureContext)
  navigator.serviceWorker.register("sw.js").catch(() => {});
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  document.getElementById("install").style.display = "";
});
document.getElementById("install").onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  document.getElementById("install").style.display = "none";
};
window.addEventListener("appinstalled", () => {
  document.getElementById("install").style.display = "none";
});
</script>
</body>
</html>
